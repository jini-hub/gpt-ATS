<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K-ATS Studio · 한국형 채용관리 시스템</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#172033;--muted:#6d7587;--line:#e6e9ef;--primary:#4f46e5;--primary2:#6366f1;--green:#16a34a;--amber:#d97706;--red:#dc2626;--shadow:0 10px 30px rgba(24,32,56,.07);--radius:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;padding:10px 12px 22px}.brand span{color:#a5b4fc}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px 14px;border-radius:11px}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.side-foot{position:absolute;bottom:18px;left:18px;right:18px;color:#9ca3af;font-size:12px;line-height:1.6}
.main{flex:1;min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:700}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.ghost{background:#f7f8ff;color:var(--primary);border-color:#dde0ff}.page{padding:26px 28px 48px;max-width:1500px;margin:auto}.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .num{font-size:30px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.title-row h2{font-size:18px;margin:0}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.b-blue{background:#eef2ff;color:#4338ca}.b-green{background:#ecfdf3;color:#15803d}.b-amber{background:#fff7ed;color:#c2410c}.b-red{background:#fef2f2;color:#b91c1c}.b-gray{background:#f3f4f6;color:#4b5563}.bar{height:8px;background:#eef0f4;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#8b5cf6);border-radius:10px}.kpi-list{display:grid;gap:13px}.kpi-line{display:grid;grid-template-columns:130px 1fr 60px;gap:12px;align-items:center;font-size:13px}.table{width:100%;border-collapse:separate;border-spacing:0}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.table th{color:var(--muted);font-size:12px;background:#fafbfc}.table tr:last-child td{border-bottom:0}.avatar{width:34px;height:34px;border-radius:50%;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:800}.person{display:flex;align-items:center;gap:10px}.score{font-size:22px;font-weight:900}.score.good{color:var(--green)}.score.mid{color:var(--amber)}.score.low{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;align-items:start}.column{background:#eef1f6;border-radius:15px;padding:10px;min-height:420px}.column-head{display:flex;justify-content:space-between;font-weight:800;font-size:13px;padding:5px 4px 10px}.candidate{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;box-shadow:0 5px 14px rgba(0,0,0,.04)}.candidate:hover{transform:translateY(-1px)}.cand-top{display:flex;justify-content:space-between;gap:8px}.cand-name{font-weight:800}.cand-meta{font-size:11px;color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{font-size:10px;border:1px solid #e5e7eb;padding:4px 6px;border-radius:6px;background:#fafafa}.cand-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.link-btn{border:0;background:transparent;color:var(--primary);font-weight:800;font-size:12px;padding:0}
.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline:0}.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px #eef2ff}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.empty{padding:55px 15px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.open{display:flex}.modal-box{background:#fff;max-width:920px;width:100%;max-height:90vh;overflow:auto;border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:#f3f4f6;border-radius:50%;width:34px;height:34px;font-size:18px}.analysis-grid{display:grid;grid-template-columns:250px 1fr;gap:18px}.score-ring{border-radius:50%;width:170px;height:170px;background:conic-gradient(var(--primary) calc(var(--score)*1%),#eceff3 0);display:grid;place-items:center;margin:5px auto 15px}.score-ring:after{content:'';width:128px;height:128px;border-radius:50%;background:#fff;position:absolute}.ring-inner{position:relative;z-index:2;font-size:34px;font-weight:900}.keyword-wrap{display:flex;flex-wrap:wrap;gap:7px}.keyword{padding:7px 9px;border-radius:8px;font-size:12px;font-weight:700}.kw-hit{background:#ecfdf3;color:#15803d}.kw-miss{background:#fef2f2;color:#b91c1c}.notice{padding:12px;border-radius:11px;background:#f7f8ff;color:#4f46e5;font-size:12px;line-height:1.6}.tabs{display:flex;gap:7px;margin-bottom:18px}.tabs button{border:0;background:#eef0f6;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:800}.tabs button.active{background:#1f2937;color:#fff}.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.searchrow input,.searchrow select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.right{margin-left:auto}.mini{font-size:11px}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.2s;z-index:40;font-size:13px}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,minmax(220px,1fr))}.analysis-grid{grid-template-columns:1fr}.sidebar{width:210px}}@media(max-width:720px){.sidebar{display:none}.page{padding:18px}.topbar{padding:0 18px}.g4,.g3,.g2{grid-template-columns:1fr}.board{grid-template-columns:1fr}.kpi-line{grid-template-columns:105px 1fr 50px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">K-ATS <span>STUDIO</span></div>
  <div class="nav">
    <button class="active" data-page="dashboard">대시보드</button>
    <button data-page="jobs">채용공고</button>
    <button data-page="candidates">지원자 관리</button>
    <button data-page="analysis">ATS 분석</button>
    <button data-page="reports">리포트</button>
  </div>
  <div class="side-foot">한국형 ATS 프로토타입<br>키워드 · 경력 · 역량 · 적합도 기반</div>
</aside>
<main class="main">
<header class="topbar"><h1 id="pageTitle">대시보드</h1><div class="top-actions"><button class="btn" id="seedBtn">데모 데이터</button><button class="btn primary" id="newJobBtn">+ 채용공고 등록</button></div></header>
<div class="page" id="page"></div>
</main></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const stages=['서류접수','서류검토','1차면접','2차면접','최종합격'];
const demoJobs=[{id:1,title:'HR Manager',dept:'인사팀',location:'서울 강남',status:'진행중',open:'2026-09-01',close:'2026-09-30',jd:'인사제도 기획 및 운영\n채용, 평가, 보상, 급여, 노무관리\nKPI/MBO 성과관리\nHR 시스템 구축 및 프로세스 개선\n노동관계법령 및 취업규칙 이해\n조직문화 및 인력계획',keywords:['HR','인사기획','채용','평가','보상','급여','노무','KPI','MBO','HRIS','노동법','조직문화']},{id:2,title:'경영지원 HRBP',dept:'경영관리',location:'판교',status:'진행중',open:'2026-09-05',close:'2026-10-05',jd:'HRBP 역할로 사업부 리더와 협업\n인력계획과 인건비 관리\n조직진단 및 제도개선\n데이터 기반 HR 지표 관리\n채용 및 온보딩',keywords:['HRBP','인력계획','인건비','조직진단','HR Analytics','채용','온보딩']}];
const demoCandidates=[
{id:101,job:1,name:'김도현',email:'dohyun.kim@example.com',stage:2,years:8,score:92,skills:['인사기획','평가','보상','노무','KPI','HRIS'],education:'경영학 석사',updated:'오늘',resume:'인사제도 기획과 운영 8년. KPI/MBO 평가체계 구축, 연봉 및 성과보상 운영, 급여와 4대보험, 취업규칙 개정, 채용 전 과정과 HRIS 개선 경험. 조직문화 프로그램과 인력계획 수립 경험 보유.'},
{id:102,job:1,name:'이서연',email:'seoyeon.lee@example.com',stage:1,years:5,score:81,skills:['채용','급여','MBO','조직문화'],education:'심리학 학사',updated:'어제',resume:'채용, 온보딩, 급여, 평가 운영 경험. MBO 관리와 조직문화 프로젝트를 담당했으며 인사 데이터 리포팅과 HR 시스템 사용 경험 보유.'},
{id:103,job:1,name:'박준혁',email:'junhyuk.park@example.com',stage:0,years:3,score:68,skills:['채용','총무','급여'],education:'경영학 학사',updated:'2일 전',resume:'채용과 급여, 총무를 폭넓게 경험. HRIS와 평가제도 경험은 제한적이나 스타트업에서 빠른 업무 적응력을 보유.'},
{id:104,job:2,name:'최유진',email:'yujin.choi@example.com',stage:2,years:7,score:89,skills:['HRBP','인력계획','인건비','조직진단','채용'],education:'MBA',updated:'오늘',resume:'사업부 HRBP 7년. 인력계획, 인건비 예산, 조직진단, 리더 코칭, 채용 및 온보딩 운영. Excel 기반 HR Analytics 리포트 구축 경험.'},
{id:105,job:2,name:'정민수',email:'minsu.jung@example.com',stage:3,years:10,score:94,skills:['HRBP','조직진단','HR Analytics','인력계획'],education:'경영학 석사',updated:'3시간 전',resume:'대기업과 중견기업 HRBP 경력 10년. 사업부 인력계획, 조직진단, 인건비 시뮬레이션, HR Analytics 대시보드 구축 및 채용전략 수립.'},
{id:106,job:2,name:'한지민',email:'jimin.han@example.com',stage:0,years:2,score:61,skills:['채용','온보딩'],education:'사회학 학사',updated:'3일 전',resume:'채용 코디네이션과 입사자 온보딩 경험. 인력계획과 인건비 관리 경험은 없음.'}
];
let state={jobs:[],candidates:[],page:'dashboard',jobFilter:'all',query:''};
function load(){try{let s=JSON.parse(localStorage.kats);if(s&&s.jobs)state=s;else throw 0}catch{state={jobs:structuredClone(demoJobs),candidates:structuredClone(demoCandidates),page:'dashboard',jobFilter:'all',query:''}}; render()}
function save(){localStorage.kats=JSON.stringify(state)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let title={dashboard:'대시보드',jobs:'채용공고',candidates:'지원자 관리',analysis:'ATS 분석',reports:'리포트'}[state.page]||'대시보드';$('#pageTitle').textContent=title; $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page)); ({dashboard:renderDashboard,jobs:renderJobs,candidates:renderCandidates,analysis:renderAnalysis,reports:renderReports}[state.page])();}
function renderDashboard(){let avg=Math.round(state.candidates.reduce((a,c)=>a+c.score,0)/Math.max(1,state.candidates.length));let open=state.jobs.filter(j=>j.status==='진행중').length;let high=state.candidates.filter(c=>c.score>=85).length; $('#page').innerHTML=`
<div class="grid g4"><div class="card"><div class="stat"><div><div class="eyebrow">진행중 공고</div><div class="num">${open}</div></div><span class="badge b-blue">LIVE</span></div></div>
<div class="card"><div class="stat"><div><div class="eyebrow">전체 지원자</div><div class="num">${state.candidates.length}</div></div><span class="badge b-gray">전체</span></div></div>
<div class="card"><div class="stat"><div><div class="eyebrow">평균 ATS 점수</div><div class="num">${avg}</div></div><span class="badge b-green">+8.2%</span></div></div>
<div class="card"><div class="stat"><div><div class="eyebrow">추천 후보</div><div class="num">${high}</div></div><span class="badge b-amber">85점+</span></div></div></div>
<div style="height:18px"></div><div class="grid g2"><div class="card"><div class="title-row"><h2>채용 Funnel</h2><span class="muted mini">전체 공고 기준</span></div>${stages.map((s,i)=>{let n=state.candidates.filter(c=>c.stage>=i).length;let pct=Math.round(n/Math.max(1,state.candidates.length)*100);return `<div class="kpi-line"><span>${s}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${n}명</b></div>`}).join('')}</div>
<div class="card"><div class="title-row"><h2>최근 지원자</h2><button class="link-btn" onclick="go('candidates')">전체 보기 →</button></div><table class="table"><thead><tr><th>지원자</th><th>공고</th><th>ATS</th><th>상태</th></tr></thead><tbody>${state.candidates.slice().sort((a,b)=>b.score-a.score).slice(0,6).map(c=>{let j=state.jobs.find(j=>j.id===c.job);return `<tr><td><div class="person"><div class="avatar">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b><div class="muted mini">${esc(c.years)}년 · ${esc(c.education)}</div></div></div></td><td>${esc(j?.title||'-')}</td><td><b class="score ${c.score>=85?'good':c.score>=70?'mid':'low'}">${c.score}</b></td><td><span class="badge ${c.stage>=3?'b-green':c.stage>=2?'b-blue':'b-gray'}">${stages[c.stage]}</span></td></tr>`}).join('')}</tbody></table></div></div>`}
function renderJobs(){ $('#page').innerHTML=`<div class="title-row"><div><h2>채용공고</h2><div class="muted mini">JD를 등록하면 ATS 분석에 바로 사용할 수 있습니다.</div></div><button class="btn primary" onclick="openJob()">+ 새 공고</button></div><div class="grid g3">${state.jobs.map(j=>`<div class="card"><div class="title-row"><span class="badge ${j.status==='진행중'?'b-green':'b-gray'}">${j.status}</span><button class="link-btn" onclick="openJob(${j.id})">편집</button></div><h3 style="margin:4px 0 6px">${esc(j.title)}</h3><div class="muted mini">${esc(j.dept)} · ${esc(j.location)} · ${esc(j.open)} ~ ${esc(j.close)}</div><div class="chips">${j.keywords.slice(0,8).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div style="margin-top:14px" class="muted mini">지원자 ${state.candidates.filter(c=>c.job===j.id).length}명 · 평균 ATS ${Math.round(state.candidates.filter(c=>c.job===j.id).reduce((a,c)=>a+c.score,0)/Math.max(1,state.candidates.filter(c=>c.job===j.id).length))}</div></div>`).join('')}</div>` }
function renderCandidates(){let list=state.candidates.filter(c=>(state.jobFilter==='all'||String(c.job)===String(state.jobFilter))&&(!state.query||(`${c.name} ${c.email} ${c.skills.join(' ')} ${c.resume}`).toLowerCase().includes(state.query.toLowerCase())));$('#page').innerHTML=`<div class="title-row"><div><h2>지원자 관리</h2><div class="muted mini">칸반 단계별로 후보자를 이동하고 ATS 리포트를 확인하세요.</div></div><button class="btn primary" onclick="openCandidate()">+ 지원자 추가</button></div><div class="searchrow"><input id="candSearch" placeholder="이름 · 스킬 · 이력서 검색" value="${esc(state.query)}" oninput="state.query=this.value;renderCandidates()"><select onchange="state.jobFilter=this.value;renderCandidates()"><option value="all">전체 공고</option>${state.jobs.map(j=>`<option value="${j.id}" ${String(state.jobFilter)===String(j.id)?'selected':''}>${esc(j.title)}</option>`).join('')}</select></div><div class="board">${stages.map((s,si)=>`<div class="column"><div class="column-head"><span>${s}</span><span class="badge b-gray">${list.filter(c=>c.stage===si).length}</span></div>${list.filter(c=>c.stage===si).map(c=>candidateCard(c)).join('')||'<div class="empty">후보자 없음</div>'}</div>`).join('')}</div>`}
function candidateCard(c){return `<div class="candidate"><div class="cand-top"><div><div class="cand-name">${esc(c.name)}</div><div class="cand-meta">${esc(c.years)}년 · ${esc(c.education)}</div></div><b class="score ${c.score>=85?'good':c.score>=70?'mid':'low'}">${c.score}</b></div><div class="chips">${c.skills.slice(0,4).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div class="cand-bottom"><span class="muted mini">${esc(c.updated)}</span><button class="link-btn" onclick="openAnalysis(${c.id})">분석 보기</button></div></div>`}
function computeAnalysis(c,j){let text=(c.resume+' '+c.skills.join(' ')).toLowerCase();let hit=j.keywords.filter(k=>text.includes(k.toLowerCase()));let miss=j.keywords.filter(k=>!hit.includes(k));let base=Math.round(hit.length/j.keywords.length*100);let exp=Math.min(15,Math.round(c.years*1.8));let edu=/석사|mba/i.test(c.education)?5:3;let score=Math.min(100,Math.round(base*.78+exp+edu));return {score,hit,miss,base,exp,edu}}
function renderAnalysis(){let c=state.candidates.slice().sort((a,b)=>b.score-a.score)[0];let j=c&&state.jobs.find(j=>j.id===c.job);$('#page').innerHTML=`<div class="grid g2"><div class="card"><div class="title-row"><h2>ATS 분석 센터</h2><span class="badge b-blue">AI-style matching</span></div><div class="field"><label>채용공고</label><select id="analysisJob">${state.jobs.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></div><div class="field"><label>지원자</label><select id="analysisCand">${state.candidates.map(x=>`<option value="${x.id}">${esc(x.name)} · ${x.score}점</option>`).join('')}</select></div><button class="btn primary" onclick="runAnalysis()" style="width:100%">ATS 점수 다시 계산</button></div><div class="card"><div class="notice">이 프로토타입은 <b>키워드 일치율 + 경력연차 + 학력 보정</b>을 조합해 채용담당자가 후보자를 빠르게 비교할 수 있도록 만든 샘플 엔진입니다.</div></div></div><div style="height:18px"></div><div id="analysisResult"></div>`; if(c&&j) showAnalysis(c.id,j.id)}
function showAnalysis(cid,jid){let c=state.candidates.find(x=>x.id==cid),j=state.jobs.find(x=>x.id==jid);if(!c||!j)return;let a=computeAnalysis(c,j);$('#analysisResult').innerHTML=`<div class="card"><div class="title-row"><h2>${esc(c.name)} · ${esc(j.title)} 적합도</h2><button class="btn" onclick="openCandidate(${c.id})">지원자 보기</button></div><div class="analysis-grid"><div><div class="score-ring" style="--score:${a.score}"><div class="ring-inner">${a.score}</div></div><div style="text-align:center" class="muted">ATS 종합 적합도</div></div><div><div class="grid g3"><div class="card" style="box-shadow:none"><div class="eyebrow">키워드</div><div class="num" style="font-size:24px">${a.base}%</div></div><div class="card" style="box-shadow:none"><div class="eyebrow">경력 가점</div><div class="num" style="font-size:24px">+${a.exp}</div></div><div class="card" style="box-shadow:none"><div class="eyebrow">학력 보정</div><div class="num" style="font-size:24px">+${a.edu}</div></div></div><h3 style="font-size:14px;margin:20px 0 10px">JD 핵심 키워드</h3><div class="keyword-wrap">${a.hit.map(k=>`<span class="keyword kw-hit">✓ ${esc(k)}</span>`).join('')}${a.miss.map(k=>`<span class="keyword kw-miss">× ${esc(k)}</span>`).join('')}</div><h3 style="font-size:14px;margin:20px 0 10px">요약</h3><div class="notice">${a.score>=85?'강력 추천 후보입니다. 핵심 직무 키워드가 다수 일치하고 경력 수준도 충분합니다.':a.score>=70?'검토 추천 후보입니다. 핵심 요건 일부가 충족되지만 면접에서 추가 확인이 필요합니다.':'보완 검토 후보입니다. JD 핵심요건 대비 키워드 일치율이 낮습니다.'}</div></div></div></div>`}
function runAnalysis(){showAnalysis($('#analysisCand').value,$('#analysisJob').value)}
function renderReports(){let avg=state.jobs.map(j=>{let cs=state.candidates.filter(c=>c.job===j.id);return {...j,n:cs.length,avg:Math.round(cs.reduce((a,c)=>a+c.score,0)/Math.max(1,cs.length)),high:cs.filter(c=>c.score>=85).length}});$('#page').innerHTML=`<div class="title-row"><div><h2>리포트</h2><div class="muted mini">채용공고별 ATS 지표를 비교합니다.</div></div><button class="btn" onclick="toast('CSV 리포트 기능은 다음 확장 모듈에 연결할 수 있습니다.')">CSV 내보내기</button></div><div class="card"><table class="table"><thead><tr><th>공고</th><th>지원자</th><th>평균 ATS</th><th>85점+ 후보</th><th>진행</th></tr></thead><tbody>${avg.map(j=>`<tr><td><b>${esc(j.title)}</b><div class="muted mini">${esc(j.dept)}</div></td><td>${j.n}</td><td><b class="score ${j.avg>=85?'good':j.avg>=70?'mid':'low'}">${j.avg}</b></td><td>${j.high}</td><td><span class="badge ${j.status==='진행중'?'b-green':'b-gray'}">${j.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function go(p){state.page=p;render()}
function openJob(id){let j=id?state.jobs.find(x=>x.id===id):null;$('#modalBox').innerHTML=`<div class="modal-head"><div><h2 style="margin:0">${j?'채용공고 수정':'새 채용공고'}</h2><div class="muted mini">ATS가 분석할 JD와 핵심 키워드를 입력하세요.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>공고명</label><input id="jtitle" value="${esc(j?.title||'HR Manager')}" placeholder="예: HR Manager"></div><div class="grid g2"><div class="field"><label>부서</label><input id="jdept" value="${esc(j?.dept||'인사팀')}"></div><div class="field"><label>근무지</label><input id="jloc" value="${esc(j?.location||'서울')}"></div></div><div class="grid g2"><div class="field"><label>공고 시작일</label><input id="jopen" type="date" value="${esc(j?.open||'2026-09-09')}"></div><div class="field"><label>마감일</label><input id="jclose" type="date" value="${esc(j?.close||'2026-09-30')}"></div></div><div class="field"><label>Job Description</label><textarea id="jjd">${esc(j?.jd||'인사제도 기획 및 운영\n채용, 평가, 보상, 급여\n노무관리 및 취업규칙\nKPI/MBO 성과관리\nHR 시스템 구축 및 프로세스 개선')}</textarea></div><div class="field"><label>핵심 키워드 <span class="muted">쉼표 또는 줄바꿈으로 구분</span></label><input id="jkeys" value="${esc(j?.keywords?.join(', ')||'HR, 인사기획, 채용, 평가, 보상, 급여, 노무, KPI, MBO, HRIS')}"></div><div class="form-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveJob(${id||0})">저장</button></div>`;openModal()}
function saveJob(id){let o={id:id||Date.now(),title:$('#jtitle').value.trim(),dept:$('#jdept').value.trim(),location:$('#jloc').value.trim(),status:'진행중',open:$('#jopen').value,close:$('#jclose').value,jd:$('#jjd').value,keywords:$('#jkeys').value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean)};if(id)state.jobs=state.jobs.map(j=>j.id===id?o:j);else state.jobs.push(o);save();closeModal();render();toast('채용공고가 저장되었습니다.');}
function openCandidate(id){let c=id?state.candidates.find(x=>x.id===id):null;$('#modalBox').innerHTML=`<div class="modal-head"><div><h2 style="margin:0">${c?'지원자 상세':'지원자 추가'}</h2><div class="muted mini">이력서 원문을 입력하면 ATS 점수가 자동 계산됩니다.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="grid g2"><div class="field"><label>이름</label><input id="cname" value="${esc(c?.name||'홍길동')}"></div><div class="field"><label>이메일</label><input id="cemail" value="${esc(c?.email||'candidate@example.com')}"></div><div class="field"><label>지원 공고</label><select id="cjob">${state.jobs.map(j=>`<option value="${j.id}" ${c?.job===j.id?'selected':''}>${esc(j.title)}</option>`).join('')}</select></div><div class="field"><label>경력 연차</label><input id="cyears" type="number" min="0" value="${c?.years||3}"></div><div class="field"><label>학력</label><input id="cedu" value="${esc(c?.education||'학사')}"></div><div class="field"><label>스킬</label><input id="cskills" value="${esc(c?.skills?.join(', ')||'채용, 급여, 평가')}"></div></div><div class="field"><label>이력서 / 경력기술서</label><textarea id="cres" placeholder="경력기술서 내용을 붙여넣으세요.">${esc(c?.resume||'')}</textarea></div><div class="notice">파일 자동 파싱을 붙이려면 PDF/DOCX 파서와 OCR 모듈을 백엔드에 연결하면 됩니다. 현재 버전은 브라우저에서 바로 동작하는 무설치 데모입니다.</div><div class="form-actions"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveCandidate(${id||0})">저장 및 ATS 계산</button></div>`;openModal()}
function saveCandidate(id){let j=+$('#cjob').value;let c={id:id||Date.now(),job:j,name:$('#cname').value.trim(),email:$('#cemail').value.trim(),stage:id?(state.candidates.find(x=>x.id===id)?.stage||0):0,years:+$('#cyears').value||0,education:$('#cedu').value.trim(),skills:$('#cskills').value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean),resume:$('#cres').value.trim(),updated:'방금 전'};let a=computeAnalysis(c,state.jobs.find(x=>x.id===j));c.score=a.score;if(id)state.candidates=state.candidates.map(x=>x.id===id?c:x);else state.candidates.push(c);save();closeModal();state.page='candidates';render();toast(`저장 완료 · ATS ${c.score}점`)}
function openModal(){$('#modal').classList.add('open')};function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#newJobBtn').onclick=()=>openJob();$('#seedBtn').onclick=()=>{state={jobs:structuredClone(demoJobs),candidates:structuredClone(demoCandidates),page:'dashboard',jobFilter:'all',query:''};save();render();toast('데모 데이터가 복구되었습니다.')};$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
load();
</script></body></html>
